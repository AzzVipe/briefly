services:
  postgres:
    image: pgvector/pgvector:pg17

    container_name: briefly-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: briefly

    ports:
      - "5432:5432"

    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend

    container_name: briefly-backend

    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/briefly
      PORT: 5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    ports:
      - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend

    container_name: briefly-frontend

    restart: unless-stopped

    depends_on:
      - backend

    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:5000/api

    ports:
      - "3000:3000"

volumes:
  postgres_data: